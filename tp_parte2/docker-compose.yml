services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: peliculas_db
    volumes:
      - ./database/peliculas_db.sql:/docker-entrypoint-initdb.d/peliculas_db.sql

  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  mysql_data:
